name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: shellcheck --shell=bash -S warning -e SC1090,SC2034 install.sh bin/rig bash/*.sh
      - name: toml syntax
        run: |
          python3 - <<'PY'
          import glob, tomllib
          for f in glob.glob("**/*.toml", recursive=True):
              with open(f, "rb") as fh:
                  tomllib.load(fh)
              print("ok", f)
          PY
      - name: yaml lint
        run: |
          pip install yamllint
          yamllint -d relaxed carapace colors.yml

  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install.sh -a into a temp HOME
        run: |
          export HOME="$(mktemp -d)"
          bash install.sh -a
          # every symlink must resolve to a real file
          broken=$(find "$HOME" -xtype l)
          [ -z "$broken" ] || { echo "broken links:"; echo "$broken"; exit 1; }
          test -L "$HOME/.claude/CLAUDE.md"
          test -L "$HOME/.local/bin/rig"
